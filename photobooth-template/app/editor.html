<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大头贴排版</title>
<style>
  :root {
    --bg: #f4f4f6; --panel: #ffffff; --text: #1d1d22; --muted: #6b6b76;
    --line: #dedee4; --accent: #2f6fed; --accent-text: #ffffff; --stage: #e6e6ea;
    --btn: #f0f0f3; --btn-hover: #e4e4ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171a; --panel: #212125; --text: #ececf0; --muted: #9a9aa6;
      --line: #34343a; --accent: #5b8cff; --accent-text: #ffffff; --stage: #101012;
      --btn: #2c2c32; --btn-hover: #37373e;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  }
  #app { display: flex; height: 100vh; }
  #stage {
    flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center;
    background: var(--stage); padding: 16px; position: relative;
  }
  #view { display: block; box-shadow: 0 2px 16px rgba(0, 0, 0, .18); touch-action: none; }
  #loading { position: absolute; color: var(--muted); }
  aside {
    width: 300px; flex: none; background: var(--panel); border-left: 1px solid var(--line);
    padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px;
  }
  h1 { font-size: 17px; margin: 0; }
  h2 { font-size: 13px; margin: 0 0 8px; color: var(--muted); font-weight: 600; }
  section { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .row > button { flex: 1 1 calc(50% - 6px); }
  button {
    font: inherit; color: var(--text); background: var(--btn); border: 1px solid var(--line);
    border-radius: 7px; padding: 7px 10px; cursor: pointer; white-space: nowrap;
  }
  button:hover:not(:disabled) { background: var(--btn-hover); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
  #current { font-size: 15px; font-weight: 600; }
  #fname { color: var(--muted); font-size: 12px; word-break: break-all; min-height: 18px; }
  .zoom { display: flex; align-items: center; gap: 8px; }
  .zoom input { flex: 1; }
  .zoom output { width: 48px; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  label.check { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
  label.check input { margin-top: 3px; }
  .hint { color: var(--muted); font-size: 12px; }
  select { font: inherit; color: var(--text); background: var(--btn); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; }
  ul.help { margin: 0; padding-left: 18px; color: var(--muted); font-size: 12px; }
  @media (max-width: 760px) {
    #app { flex-direction: column; height: auto; }
    #stage { height: 70vh; }
    aside { width: 100%; border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <span id="loading">正在载入模板…</span>
    <canvas id="view" hidden></canvas>
  </div>
  <aside>
    <h1>大头贴排版</h1>

    <section>
      <h2>当前格子</h2>
      <div id="current">左 1</div>
      <div id="fname"></div>
      <div class="row">
        <button id="pick">选择图片</button>
        <button id="clear">清除</button>
      </div>
      <div class="zoom">
        <span>缩放</span>
        <input id="zoom" type="range" min="-2.3" max="2.3" step="0.01" value="0">
        <output id="zoomval">100%</output>
      </div>
      <div class="row">
        <button id="fill" title="铺满格子，不留空白">铺满</button>
        <button id="fit" title="整张图都显示出来">完整显示</button>
        <button id="rotl">向左转 90°</button>
        <button id="rotr">向右转 90°</button>
        <button id="flip">水平翻转</button>
        <button id="center">居中</button>
      </div>
    </section>

    <section>
      <h2>排版</h2>
      <label class="check"><input id="sync" type="checkbox" checked>
        <span>左右同步<br><span class="hint">同一行左右两格用同一张图、同样的裁剪</span></span></label>
      <button id="batch">批量导入图片…</button>
      <span class="hint" id="batchhint">按顺序放进第 1–4 行</span>
    </section>

    <section>
      <h2>导出</h2>
      <div class="row">
        <select id="fmt">
          <option value="png">PNG（最清晰）</option>
          <option value="jpg">JPG（文件小）</option>
        </select>
      </div>
      <button class="primary" id="exAll">导出整张</button>
      <div class="row">
        <button id="exLeft">只导出左条</button>
        <button id="exRight">只导出右条</button>
      </div>
      <span class="hint">文件名为当天日期，例如 <span id="today"></span>。尺寸 3840×5720。</span>
    </section>

    <section>
      <h2>操作方法</h2>
      <ul class="help">
        <li>点格子选中；空格子点一下就能选图</li>
        <li>把图片拖到格子上直接放入，一次拖多张会依次往后放</li>
        <li>按住拖动：移动照片</li>
        <li>滚轮或触控板双指：以鼠标位置为中心缩放</li>
        <li>双击：恢复铺满</li>
        <li>方向键微调位置（按住 Shift 移得更多），+ / − 缩放，Delete 清除</li>
      </ul>
    </section>
  </aside>
</div>
<input id="file" type="file" accept="image/*" multiple hidden>

<script>
"use strict";
const TEMPLATE_SRC = "__TEMPLATE_DATA_URI__";

// Template geometry (pixels of the 3840x5720 template).
const W = 3840, H = 5720, SW = 1650, SH = 1208;
const COLS = [180, 2010], ROWS = [270, 1548, 2828, 4106];

const $ = (s) => document.querySelector(s);
const view = $("#view"), vctx = view.getContext("2d");
const fileInput = $("#file");

const slots = [];
for (let c = 0; c < 2; c++)
  for (let r = 0; r < 4; r++)
    slots.push({ c, r, x: COLS[c], y: ROWS[r], img: null, name: "", zoom: 1, ox: 0, oy: 0, rot: 0, flip: false });

let sel = 0, sync = true, pickTarget = 0, scale = 1;
const tpl = new Image();

const label = (s) => (s.c ? "右 " : "左 ") + (s.r + 1);
const twin = (s) => slots[(1 - s.c) * 4 + s.r];
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

function dims(s) {
  const w = s.img.naturalWidth, h = s.img.naturalHeight;
  return s.rot % 2 ? [h, w] : [w, h];
}
const cover = (s) => { const [w, h] = dims(s); return Math.max(SW / w, SH / h); };
const contain = (s) => { const [w, h] = dims(s); return Math.min(SW / w, SH / h); };

function drawPhoto(ctx, s) {
  if (!s.img) return;
  ctx.save();
  ctx.beginPath();
  ctx.rect(s.x, s.y, SW, SH);
  ctx.clip();
  ctx.translate(s.x + SW / 2 + s.ox, s.y + SH / 2 + s.oy);
  if (s.flip) ctx.scale(-1, 1);
  ctx.rotate((s.rot * Math.PI) / 2);
  const k = cover(s) * s.zoom;
  const w = s.img.naturalWidth * k, h = s.img.naturalHeight * k;
  ctx.drawImage(s.img, -w / 2, -h / 2, w, h);
  ctx.restore();
}

// ---------- preview ----------
let frameQueued = false;
function render() {
  if (frameQueued) return;
  frameQueued = true;
  requestAnimationFrame(() => { frameQueued = false; draw(); });
}

function draw() {
  const k = view.width / W;
  vctx.setTransform(k, 0, 0, k, 0, 0);
  vctx.imageSmoothingQuality = "high";
  vctx.clearRect(0, 0, W, H);
  for (const s of slots) {
    vctx.fillStyle = s.img ? "#ffffff" : "#ececf1";
    vctx.fillRect(s.x, s.y, SW, SH);
    drawPhoto(vctx, s);
  }
  vctx.drawImage(tpl, 0, 0, W, H);

  vctx.textAlign = "center";
  vctx.textBaseline = "middle";
  vctx.font = "600 64px -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif";
  for (const s of slots) {
    if (s.img) continue;
    vctx.fillStyle = "#8b8b97";
    vctx.fillText(label(s), s.x + SW / 2, s.y + SH / 2 - 50);
    vctx.font = "48px -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif";
    vctx.fillText("点击或拖入图片", s.x + SW / 2, s.y + SH / 2 + 40);
    vctx.font = "600 64px -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif";
  }

  const s = slots[sel];
  const lw = 3 / scale;
  vctx.lineWidth = lw;
  vctx.strokeStyle = "#2f6fed";
  vctx.setLineDash([]);
  vctx.strokeRect(s.x + lw / 2, s.y + lw / 2, SW - lw, SH - lw);
  if (sync) {
    const t = twin(s);
    vctx.setLineDash([12 / scale, 8 / scale]);
    vctx.strokeRect(t.x + lw / 2, t.y + lw / 2, SW - lw, SH - lw);
    vctx.setLineDash([]);
  }
}

function layout() {
  const st = $("#stage").getBoundingClientRect();
  const availW = st.width - 32, availH = st.height - 32;
  scale = Math.min(availW / W, availH / H);
  const cw = Math.max(1, Math.round(W * scale)), ch = Math.max(1, Math.round(H * scale));
  const dpr = window.devicePixelRatio || 1;
  view.style.width = cw + "px";
  view.style.height = ch + "px";
  view.width = Math.round(cw * dpr);
  view.height = Math.round(ch * dpr);
  render();
}

// ---------- state changes ----------
function changed(s) {
  if (sync) {
    const t = twin(s);
    Object.assign(t, { img: s.img, name: s.name, zoom: s.zoom, ox: s.ox, oy: s.oy, rot: s.rot, flip: s.flip });
  }
  updatePanel();
  render();
}

function select(i) { sel = i; updatePanel(); render(); }

function resetFit(s) { s.zoom = 1; s.ox = 0; s.oy = 0; }

function zoomAt(s, factor, px, py) {
  const z2 = clamp(s.zoom * factor, 0.1, 10);
  const ratio = z2 / s.zoom;
  const rx = px - (s.x + SW / 2), ry = py - (s.y + SH / 2);
  s.ox = rx - (rx - s.ox) * ratio;
  s.oy = ry - (ry - s.oy) * ratio;
  s.zoom = z2;
  changed(s);
}
const zoomCenter = (s, factor) => zoomAt(s, factor, s.x + SW / 2 + s.ox, s.y + SH / 2 + s.oy);

function updatePanel() {
  const s = slots[sel];
  $("#current").textContent = label(s) + (sync ? `（与${label(twin(s))}同步）` : "");
  $("#fname").textContent = s.name || "还没有图片";
  const has = !!s.img;
  for (const id of ["clear", "zoom", "fill", "fit", "rotl", "rotr", "flip", "center"]) $("#" + id).disabled = !has;
  $("#zoom").value = Math.log(s.zoom);
  $("#zoomval").textContent = Math.round(s.zoom * 100) + "%";
  $("#batchhint").textContent = sync ? "按顺序放进第 1–4 行（左右相同）" : "按顺序放进左 1–4、右 1–4";
}

// ---------- loading images ----------
function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error(file.name));
    img.src = url;
  });
}

async function placeFiles(files, startIndex) {
  const list = [...files].filter((f) => f.type.startsWith("image/") || /\.(jpe?g|png|webp|gif|bmp|heic|heif|avif)$/i.test(f.name));
  if (!list.length) return;
  let targets;
  if (sync) {
    const start = slots[startIndex];
    targets = [];
    for (let r = start.r; r < 4; r++) targets.push(start.c * 4 + r);
  } else {
    targets = [];
    for (let i = startIndex; i < 8; i++) targets.push(i);
  }
  const failed = [];
  for (let n = 0; n < Math.min(list.length, targets.length); n++) {
    const s = slots[targets[n]];
    try {
      s.img = await loadImage(list[n]);
      s.name = list[n].name;
      s.rot = 0; s.flip = false;
      resetFit(s);
      changed(s);
    } catch (e) {
      failed.push(list[n].name);
    }
  }
  select(targets[0]);
  if (failed.length)
    alert("这些图片打不开：\n" + failed.join("\n") + "\n\n如果是 iPhone 的 HEIC 照片，请先转成 JPG 再导入。");
  if (list.length > targets.length)
    alert(`选了 ${list.length} 张，只放得下 ${targets.length} 张，多出的已忽略。`);
}

function pick(i) {
  pickTarget = i;
  fileInput.value = "";
  fileInput.click();
}
fileInput.addEventListener("change", () => placeFiles(fileInput.files, pickTarget));

// ---------- mouse / touch on the preview ----------
function toTpl(e) {
  const r = view.getBoundingClientRect();
  return [((e.clientX - r.left) / r.width) * W, ((e.clientY - r.top) / r.height) * H];
}
const hit = (x, y) => slots.findIndex((s) => x >= s.x && x < s.x + SW && y >= s.y && y < s.y + SH);

let drag = null;
view.addEventListener("pointerdown", (e) => {
  const [x, y] = toTpl(e);
  const i = hit(x, y);
  if (i < 0) return;
  select(i);
  const s = slots[i];
  drag = { i, x, y, cx: e.clientX, cy: e.clientY, ox: s.ox, oy: s.oy, moved: false };
  view.setPointerCapture(e.pointerId);
});
view.addEventListener("pointermove", (e) => {
  const [x, y] = toTpl(e);
  if (!drag) {
    const i = hit(x, y);
    view.style.cursor = i < 0 ? "default" : slots[i].img ? "grab" : "pointer";
    return;
  }
  if (Math.hypot(e.clientX - drag.cx, e.clientY - drag.cy) > 3) drag.moved = true;
  const s = slots[drag.i];
  if (s.img && drag.moved) {
    view.style.cursor = "grabbing";
    s.ox = drag.ox + (x - drag.x);
    s.oy = drag.oy + (y - drag.y);
    changed(s);
  }
});
function endDrag() {
  if (drag && !drag.moved && !slots[drag.i].img) pick(drag.i);
  drag = null;
}
view.addEventListener("pointerup", endDrag);
view.addEventListener("pointercancel", () => { drag = null; });
view.addEventListener("dblclick", (e) => {
  const [x, y] = toTpl(e);
  const i = hit(x, y);
  if (i >= 0 && slots[i].img) { resetFit(slots[i]); changed(slots[i]); }
});
view.addEventListener("wheel", (e) => {
  const [x, y] = toTpl(e);
  const i = hit(x, y);
  if (i < 0 || !slots[i].img) return;
  e.preventDefault();
  if (i !== sel) select(i);
  const step = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
  zoomAt(slots[i], Math.exp(-step * (e.ctrlKey ? 0.01 : 0.0015)), x, y);
}, { passive: false });

// drag & drop files
const stage = $("#stage");
stage.addEventListener("dragover", (e) => { e.preventDefault(); e.dataTransfer.dropEffect = "copy"; });
stage.addEventListener("drop", (e) => {
  e.preventDefault();
  if (!e.dataTransfer.files.length) return;
  const [x, y] = toTpl(e);
  let i = hit(x, y);
  if (i < 0) i = sel;
  placeFiles(e.dataTransfer.files, i);
});

// keyboard
document.addEventListener("keydown", (e) => {
  if (e.target instanceof HTMLInputElement || e.target instanceof HTMLSelectElement) return;
  const s = slots[sel];
  const step = e.shiftKey ? 40 : 6;
  const moves = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] };
  if (moves[e.key] && s.img) {
    e.preventDefault();
    s.ox += moves[e.key][0]; s.oy += moves[e.key][1];
    changed(s);
  } else if ((e.key === "+" || e.key === "=") && s.img) {
    zoomCenter(s, 1.05);
  } else if ((e.key === "-" || e.key === "_") && s.img) {
    zoomCenter(s, 1 / 1.05);
  } else if ((e.key === "Delete" || e.key === "Backspace") && s.img) {
    e.preventDefault();
    clearSlot(s);
  } else if (e.key === "Tab") {
    e.preventDefault();
    select((sel + (e.shiftKey ? 7 : 1)) % 8);
  }
});

// ---------- panel ----------
function clearSlot(s) {
  s.img = null; s.name = ""; s.rot = 0; s.flip = false;
  resetFit(s);
  changed(s);
}
$("#pick").onclick = () => pick(sel);
$("#clear").onclick = () => clearSlot(slots[sel]);
$("#zoom").addEventListener("input", (e) => {
  const s = slots[sel];
  if (s.img) zoomCenter(s, Math.exp(+e.target.value) / s.zoom);
});
$("#fill").onclick = () => { const s = slots[sel]; resetFit(s); changed(s); };
$("#fit").onclick = () => { const s = slots[sel]; s.zoom = contain(s) / cover(s); s.ox = 0; s.oy = 0; changed(s); };
$("#rotl").onclick = () => { const s = slots[sel]; s.rot = (s.rot + 3) % 4; resetFit(s); changed(s); };
$("#rotr").onclick = () => { const s = slots[sel]; s.rot = (s.rot + 1) % 4; resetFit(s); changed(s); };
$("#flip").onclick = () => { const s = slots[sel]; s.flip = !s.flip; changed(s); };
$("#center").onclick = () => { const s = slots[sel]; s.ox = 0; s.oy = 0; changed(s); };
$("#batch").onclick = () => pick(sync ? slots[sel].c * 4 : 0);

$("#sync").addEventListener("change", (e) => {
  const want = e.target.checked;
  if (want) {
    const differ = [0, 1, 2, 3].some((r) => slots[r].img && slots[4 + r].img && slots[r].img !== slots[4 + r].img);
    if (differ && !confirm("开启同步后，右列会改成和左列一样（左列有图的行）。继续吗？")) {
      e.target.checked = false;
      return;
    }
    sync = true;
    for (let r = 0; r < 4; r++) changed(slots[r].img ? slots[r] : slots[4 + r]);
  } else {
    sync = false;
  }
  updatePanel();
  render();
});

// ---------- export ----------
function today() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

async function exportImage(part) {
  const fmt = $("#fmt").value;
  const x0 = part === "right" ? W / 2 : 0;
  const w = part === "all" ? W : W / 2;
  const inPart = slots.filter((s) => part === "all" || (part === "left") === (s.c === 0));
  const empty = inPart.filter((s) => !s.img).length;
  if (empty && !confirm(`还有 ${empty} 个格子没放图片，仍然导出吗？`)) return;

  const c = document.createElement("canvas");
  c.width = w; c.height = H;
  const ctx = c.getContext("2d");
  ctx.imageSmoothingQuality = "high";
  ctx.translate(-x0, 0);
  // Any part of a slot the photo does not cover prints white, not transparent.
  ctx.fillStyle = "#ffffff";
  for (const s of inPart) { ctx.fillRect(s.x, s.y, SW, SH); drawPhoto(ctx, s); }
  ctx.drawImage(tpl, 0, 0, W, H);

  const blob = await new Promise((r) => c.toBlob(r, fmt === "jpg" ? "image/jpeg" : "image/png", 0.95));
  // ASCII only: some browsers drop a non-ASCII download name and save as "download".
  const suffix = part === "left" ? "-left" : part === "right" ? "-right" : "";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${today()}${suffix}.${fmt}`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
$("#exAll").onclick = () => exportImage("all");
$("#exLeft").onclick = () => exportImage("left");
$("#exRight").onclick = () => exportImage("right");

// ---------- start ----------
$("#today").textContent = today() + ".png";
tpl.onload = () => {
  if (tpl.naturalWidth !== W || tpl.naturalHeight !== H) {
    $("#loading").textContent = "模板尺寸不对，文件可能已损坏。";
    return;
  }
  $("#loading").remove();
  view.hidden = false;
  layout();
  updatePanel();
};
tpl.onerror = () => { $("#loading").textContent = "模板载入失败。"; };
tpl.src = TEMPLATE_SRC;
window.addEventListener("resize", layout);
</script>
</body>
</html>
